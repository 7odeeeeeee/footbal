<style>

<canvas id="c"></canvas>
<div id="hud"><span id="h1"></span><span id="h2"></span></div>
<div id="ev"></div><div id="ban"></div><div id="rot">دور الهاتف أفقي 📱</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,QDPR=2,QL=2;
function rs(){DPR=Math.min(window.devicePixelRatio||1,QDPR);W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,300));if(window.ResizeObserver)new ResizeObserver(rs).observe(cv);rs();
let R=600,N=100,RT=600,HW=15,GH=26,SL=[];const PR=10,BR=6,TAU=Math.PI*2;let TG=[50,25,12,6,3,2,1],MODE=100;let eqPet='';
let P,B,round,state,pause,evT=0,banT=0,human,time=0;
const joy={a:false,x0:0,y0:0,dx:0,dy:0},keys={};let shootReq=false;
const $=id=>document.getElementById(id);

function newBall(){const a=Math.random()*TAU,r=Math.random()*40;return{x:Math.cos(a)*r,y:Math.sin(a)*r,vx:0,vy:0,last:null}}
function alive(){return P.filter(p=>p.alive)}
function place(p){p.x=Math.cos(p.a)*(RT-45);p.y=Math.sin(p.a)*(RT-45);p.vx=p.vy=0}
function spawnBalls(){B=[];const na=alive().length,n=SM&&SM.kind==='shoot'?3:(na<=3?1:Math.ceil(na/2));for(let k=0;k<n;k++)B.push(newBall())}
function banner(t,s){$('ban').textContent=t;banT=s}
function init(){
  N=SM?SM.players:MODE;RT=SM?380:arenaR(MODE);R=RT;P=[];for(let i=0;i<N;i++){const a=i/N*TAU+Math.PI/2;const p={i,a,alive:true,x:0,y:0,vx:0,vy:0,spd:1,pow:1,goals:0,base:i?125+Math.random()*30:150,cd:0,t:null,bt:null,br:0,lx:1,ly:0,def:Math.random()<D.def,look:Math.floor(Math.random()*100)};place(p);P.push(p)}
  human=P[0];round=0;PU.length=0;puT=4;R=RT=SM?380:arenaR(MODE);N=SM?SM.players:MODE;HW=SM?32:(MODE===50?18:15);GH=SM?32:(MODE===50?27.5:26);SL=P.slice();TG=SM?[0]:(MODE===50?[25,12,6,3,2,1]:[50,25,12,6,3,2,1]);runCoins=0;{const bs=P.slice(1).sort(()=>Math.random()-.5).slice(0,1+(Math.random()<.5?1:0)),ks=Object.keys(FLAGS);for(const b of bs)b.flag=ks[Math.floor(Math.random()*ks.length)]}if(SM){SM.left=SM.time||0;SM.winner=null;SM.col=0;if(SM.kind!=='duel'){P[1].frz=1e9;P[1].dummy=true}}if(TRIAL){human.gk=1e9;$('ev').textContent='🧪 تجريبي: حارس يحمي مرماك طول المباراة';evT=5}spawnBalls();state='play';pause=0;$('ov').style.display='none';
  banner((SM?SM.name:'الراوند 1: لين يبقون '+TG[0]),3);
}
function pickTarget(p){if(human.alive&&p!==human&&Math.random()<D.hunt)return human;const a=alive().filter(q=>q!==p);return a[Math.floor(Math.random()*a.length)]}

function scored(idx,b){if(SM){scoreGoal(idx,b);return}
  const v=P[idx];v.alive=false;const s=scorerOf(b,v);if(s===human&&s!==v){addCoins(5);celebrate();human.cel=1.4;track('goals',1)}sfx(v===human?'out':(s&&s===human?'mygoal':'goal'));boom();if(0)banner(s&&s!==v?'⚽ هدف! #'+(s.i+1):'هدف بنفس المرمى!',1.4);
  if(s&&s!==v){s.goals++;s.spd=Math.min(1.8,s.spd+.08);s.pow=Math.min(2,s.pow+.1)}
  $('ev').textContent=(s&&s!==v?'#'+(s.i+1)+' سجل بمرمى #'+(v.i+1):'هدف بنفس المرمى! #'+(v.i+1)+' طلع');evT=2.5;
  B[B.indexOf(b)]=newBall();
  if(v===human){state='out';human.rank=alive().length+1}
  checkRound();
}
function checkRound(){
  const n=alive().length;
  if(state==='over')return;
  if(n<=TG[round]){
    round++;
    if(round>=TG.length){state='over';return}
    if(round===3&&human.alive)track('r4',1);pause=2.8;sfx('whistle');banner('الراوند '+(round+1)+': لين يبقون '+TG[round],2.8);
    regroup();alive().forEach(place);spawnBalls();
  }
}
function step(dt){
  time+=dt;puUpdate(dt);
  const al=alive();
  // human input
  let ix=0,iy=0;
  if(joy.a){const m=Math.hypot(joy.dx,joy.dy);if(m>6){const k=Math.min(m,50)/50;ix=joy.dx/m*k;iy=joy.dy/m*k}}
  if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iy-=1;if(keys.ArrowDown||keys.s)iy+=1;
  if(human.alive){
    const m=Math.hypot(ix,iy);
    if(m>.01){const c=camDir(),wx=ix*(-c.y)+(-iy)*c.x,wy=ix*c.x+(-iy)*c.y,sm=human.base*human.spd*(sprint?1.45:1)*(dash>0?2.2:1)*(human.boost>0?1.5:1);dash-=dt;human.vx=wx*sm;human.vy=wy*sm;const q=Math.hypot(wx,wy)||1;human.lx=wx/q;human.ly=wy/q}else{human.vx=human.vy=0;dash-=dt}
  }
  // bots
  for(const p of al){
    if(p===human)continue;
    p.cd-=dt;p.br-=dt;if(p.frz>0){p.vx=p.vy=0;continue}
    if(!p.t||!p.t.alive)p.t=pickTarget(p);
    if(p.br<=0||!p.bt){p.br=.7;let best=1e9,bb=null;for(const b of B){const d=Math.hypot(b.x-p.x,b.y-p.y)*(1+Math.random()*.6);if(d<best){best=d;bb=b}}p.bt=bb}
    let def=null;{const gx=Math.cos(p.a)*(R-40),gy=Math.sin(p.a)*(R-40);if(p.def){for(const bb of B){const dxg=gx-bb.x,dyg=gy-bb.y,dg=Math.hypot(dxg,dyg)||1,spd=Math.hypot(bb.vx,bb.vy);if(dg<300&&spd>90&&(bb.vx*dxg+bb.vy*dyg)/(spd*dg)>.8){def=bb;break}}}}
    if(def){p.bt=def;p.br=.3}
    const b=p.bt;if(!b)continue;
    const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy)||1;
    const sp=p.base*p.spd*D.spd*(p.boost>0?1.5:1);p.vx=dx/d*sp;p.vy=dy/d*sp;
    if(d<PR+BR+8&&p.cd<=0&&p.t){
      const ta=p.t.a+(Math.random()-.5)*D.jit;
      const ax=Math.cos(ta)*R-b.x,ay=Math.sin(ta)*R-b.y,am=Math.hypot(ax,ay)||1;
      const pw=380*p.pow;b.vx=ax/am*pw;b.vy=ay/am*pw;b.last=p;p.cd=.5+Math.random()*.4;p.kick=.3;if(Math.hypot(p.x-human.x,p.y-human.y)<70)sfx('kick');
    }
  }
  // move players
  for(const p of al){
    if(p.frz>0){p.frz-=dt;p.vx=p.vy=0}else{p.x+=p.vx*dt;p.y+=p.vy*dt}
    const r=Math.hypot(p.x,p.y),mr=R-PR-2;if(r>mr){p.x*=mr/r;p.y*=mr/r}
  }
  // human shoot
  if(shootReq&&human.alive){
    for(const b of B){if(Math.hypot(b.x-human.x,b.y-human.y)<PR+BR+16){const pw=650*human.pow;b.vx=human.lx*pw;b.vy=human.ly*pw;b.last=human;human.kick=.3;sfx('kick')}}
  }
  shootReq=false;
  // balls
  for(const b of B.slice()){if(b.last!==b._l){b.prev=b._l;b._l=b.last}
    for(const p of al){
      const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);
      if(d<PR+BR){
        const nx=dx/(d||1),ny=dy/(d||1);
        b.x=p.x+nx*(PR+BR);b.y=p.y+ny*(PR+BR);
        if(p===human){b.vx=p.vx*1.3+nx*40;b.vy=p.vy*1.3+ny*40}
        else{b.vx+=nx*30;b.vy+=ny*30}
        b.last=p;
      }
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    const f=Math.exp(-.9*dt);b.vx*=f;b.vy*=f;
    const r=Math.hypot(b.x,b.y);
    if(r>R-BR){
      const th=Math.atan2(b.y,b.x)-Math.PI/2;
      const idx=Math.floor(((th+TAU)%TAU)/TAU*N+.5)%N,SP=SL[idx],off=SP?Math.abs(Math.atan2(Math.sin(th-(SP.a-Math.PI/2)),Math.cos(th-(SP.a-Math.PI/2))))*R:1e9;
      if(SP&&SP.alive&&off<=HW){const sc0=scorerOf(b,SP);if(SP.gk>0||!sc0||sc0===SP||heartSave(SP)){saveBall(b,r);continue}scored(SP.i,b);if(state==='over'||pause>0)return;continue}
      const nx=b.x/r,ny=b.y/r,dp=b.vx*nx+b.vy*ny;
      b.vx-=1.8*dp*nx;b.vy-=1.8*dp*ny;b.x=nx*(R-BR);b.y=ny*(R-BR);
    }
  }
}
function end(){
  const win=human.alive;
  $('ot').innerHTML=(win?'🏆 فزت! أنت البطل':'طلعت')+'<br><small style="font-size:16px;font-weight:600">أهدافك: '+human.goals+'</small>';
  $('ov').style.display='flex';
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0b1a12';ctx.fillRect(0,0,W,H);
  const view=human.alive?520:1300,sc=Math.min(W,H)/view;
  const cx=human.alive?human.x:0,cy=human.alive?human.y:0;
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
  ctx.fillStyle='#1f7a3d';ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.fill();
  ctx.strokeStyle='#ffffff55';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,60,0,TAU);ctx.stroke();
  // goals / walls
  const w=TAU/N;
  for(const p of P){
    ctx.beginPath();ctx.arc(0,0,R,p.a-w/2,p.a+w/2);
    ctx.strokeStyle=p.alive?(p===human?'#ffd60a':'#fff'):'#555';ctx.lineWidth=p.alive?10:14;ctx.stroke();
  }
  // balls
  for(const b of B){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,BR,0,TAU);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.stroke()}
  // players
  for(const p of P){
    if(!p.alive)continue;
    ctx.fillStyle=p===human?'#ffd60a':'hsl('+(p.i*3.6)+',70%,55%)';
    ctx.beginPath();ctx.arc(p.x,p.y,PR,0,TAU);ctx.fill();
    if(p===human){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}
  }
  ctx.restore();
  // minimap
  const mr=48,mx=W-mr-12,my=H-mr-24-(parseInt(getComputedStyle(document.documentElement).paddingBottom)||0),k=mr/R;
  ctx.fillStyle='#000a';ctx.beginPath();ctx.arc(mx,my,mr,0,TAU);ctx.fill();
  for(const p of P)if(p.alive){ctx.fillStyle=p===human?'#ffd60a':'#fff';ctx.fillRect(mx+p.x*k-1,my+p.y*k-1,p===human?4:2,p===human?4:2)}
  // joystick
  if(joy.a){ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.x0,joy.y0,50,0,TAU);ctx.stroke();
    const m=Math.min(Math.hypot(joy.dx,joy.dy),50),a=Math.atan2(joy.dy,joy.dx);
    ctx.fillStyle='#fffa';ctx.beginPath();ctx.arc(joy.x0+Math.cos(a)*m,joy.y0+Math.sin(a)*m,20,0,TAU);ctx.fill()}
}
function hud(){
  $('h1').textContent='باقي: '+alive().length+' ← '+TG[Math.min(round,TG.length-1)];
  $('h2').textContent='أهداف '+human.goals+' | سرعة '+Math.round(human.spd*100)+'%';
}
let last=performance.now(),ended=false;
function loop(t){
  let dt=Math.min(.033,(t-last)/1000);last=t;R+=(RT-R)*Math.min(1,dt*3);fpsCheck(dt);
  const vv=window.visualViewport,vw=Math.min(document.documentElement.clientWidth||1e9,innerWidth||1e9,vv&&vv.width||1e9),vh=Math.min(document.documentElement.clientHeight||1e9,innerHeight||1e9,vv&&vv.height||1e9);
  if(vw!==W||vh!==H){cv.style.width=vw+'px';cv.style.height=vh+'px';scrollTo(0,0);W=vw;H=vh;cv.width=vw*DPR;cv.height=vh*DPR;joy.a=false}
  if(pause>0)pause-=dt;
  else if(state!=='over'&&W>=H&&!menuOpen)step(dt);
  if(evT>0){evT-=dt;if(evT<=0)$('ev').textContent=''}
  if(banT>0){banT-=dt;if(banT<=0)$('ban').textContent=''}
  if(state==='over'&&!ended){ended=true;end()}
  if(state==='out'&&!ended){ended=true;end()}
  draw();hud();requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',e=>{if(e.clientX>W*.5){camDrag(e);return}joy.a=true;joy.x0=e.clientX;joy.y0=e.clientY;joy.dx=joy.dy=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.pointerId===camId){camMove(e);return}if(joy.a){joy.dx=e.clientX-joy.x0;joy.dy=e.clientY-joy.y0}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{if(e.pointerId===camId){camId=-1;return}joy.a=false;joy.dx=joy.dy=0}));
$('shoot').addEventListener('pointerdown',e=>{e.stopPropagation();shootReq=true});
addEventListener('keydown',e=>{keys[e.key.length>1?e.key:e.key.toLowerCase()]=true;if(e.key===' ')shootReq=true});
addEventListener('keyup',e=>{keys[e.key.length>1?e.key:e.key.toLowerCase()]=false});
$('rb').addEventListener('click',()=>{ended=false;init()});
let camId=-1,camX=0;function camDrag(e){camId=e.pointerId;camX=e.clientX;cv.setPointerCapture(e.pointerId)}function camMove(e){camA+=(e.clientX-camX)*.008;camX=e.clientX}
let camA=-Math.PI/2,sprint=false,dash=0;
function camDir(){return{x:Math.cos(camA),y:Math.sin(camA)}}
function mkb(id,t,css,dn,up){const b=document.createElement('button');b.id=id;b.textContent=t;b.style.cssText='position:fixed;width:70px;height:70px;border-radius:50%;border:3px solid #fff8;background:#0009;color:#fff;font-weight:700;font-size:14px;'+css;b.addEventListener('pointerdown',e=>{e.stopPropagation();dn()});if(up)['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,up));document.body.appendChild(b)}
mkb('spr','ركض','right:18px;bottom:calc(28px + env(safe-area-inset-bottom,0px))',()=>{sprint=true},()=>{sprint=false});
mkb('fs','⛶','left:50%;margin-left:-22px;top:10px;width:44px;height:44px;font-size:20px',()=>{try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(_){}});
mkb('dg','مراوغة','right:100px;bottom:calc(28px + env(safe-area-inset-bottom,0px))',()=>{dash=.25});
const crowd=[];for(let i=0;i<700;i++)crowd.push([Math.random(),Math.random(),Math.random()*360]);
let PJ;
function goalPt(a,off,rad,h){const c=Math.cos(a),s=Math.sin(a),q=PJ(c*rad-s*off,s*rad+c*off);return[q.sx,q.sy-h*q.k]}
function drawGoal(p,q){
 const a=p.a,hw=HW,gh=GH,fr=R-1,bk=R+24,w=2*Math.PI*R/N*q.k*1.05;
 wallSeg(p.a,'#202733',48,'hsl('+((p.i*37+time*40)%360)+',80%,52%)',8,13);
 const FL=goalPt(a,-hw,fr,0),FR=goalPt(a,hw,fr,0),FLT=goalPt(a,-hw,fr,gh),FRT=goalPt(a,hw,fr,gh),BL=goalPt(a,-hw,bk,0),B2=goalPt(a,hw,bk,0),BLT=goalPt(a,-hw,bk,gh),BRT=goalPt(a,hw,bk,gh);
 const quad=(A,B,C,D,fill)=>{ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.lineTo(C[0],C[1]);ctx.lineTo(D[0],D[1]);ctx.closePath();ctx.fill()};
 const mix=(A,B,t)=>[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t];
 quad(BL,B2,BRT,BLT,'#10141b99');{const fid=p===human?eqFlag:p.flag;if(fid&&q.k>.12)flagBack(fid,BL,B2,BLT,BRT)}
 quad(FLT,FRT,BRT,BLT,'#ffffff22');quad(FL,FLT,BLT,BL,'#ffffff18');quad(FR,FRT,BRT,B2,'#ffffff18');
 ctx.strokeStyle='#ffffff77';ctx.lineWidth=1;ctx.beginPath();
 for(let u=0;u<=6;u++){const t=u/6,a1=mix(FLT,FRT,t),a2=mix(BLT,BRT,t),b1=mix(BL,B2,t);ctx.moveTo(a1[0],a1[1]);ctx.lineTo(a2[0],a2[1]);ctx.moveTo(b1[0],b1[1]);ctx.lineTo(a2[0],a2[1])}
 for(let v=1;v<4;v++){const t=v/4,l=mix(BL,BLT,t),r=mix(B2,BRT,t);ctx.moveTo(l[0],l[1]);ctx.lineTo(r[0],r[1])}
 ctx.stroke();
 ctx.strokeStyle=p===human?'#ffd60a':'#fff';ctx.lineWidth=Math.max(1.5,3.5*q.k);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(FL[0],FL[1]);ctx.lineTo(FLT[0],FLT[1]);ctx.lineTo(FRT[0],FRT[1]);ctx.lineTo(FR[0],FR[1]);ctx.stroke();ctx.lineCap='butt';
 if(q.k>.45){ctx.fillStyle='#fff';ctx.font='bold '+Math.max(9,13*q.k)+'px sans-serif';ctx.fillText(p.i+1,(FLT[0]+FRT[0])/2,FLT[1]-6*q.k)}
 if(p===human&&eqPet)drawPet((FLT[0]+FRT[0])/2,FLT[1],q);
 
}
const CF=[];let flash=0;
function boom(){return;flash=1;for(let i=0;i<80;i++)CF.push({x:Math.random()*W,y:-10-Math.random()*60,vx:Math.random()*4-2,vy:Math.random()*3+1.5,c:'hsl('+Math.random()*360+',90%,60%)',l:150})}
